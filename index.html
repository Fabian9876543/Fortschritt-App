<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fortschritt</title>
    <meta name="description" content="Gamifizierter Tracker für Lesen und Deep Work – mit XP, Levels, Streaks und Tages-Quests." />
    <meta name="theme-color" content="#f6f5f2" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fortschritt" />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      // Gewähltes Design sofort setzen, damit nichts aufblitzt
      try {
        const t = JSON.parse(localStorage.getItem('fortschritt:prefs:v1') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <a class="brand" href="#/heute"><img src="icons/icon.svg" alt="" width="32" height="32" /><span>Fortschritt</span></a>
        <nav class="side-nav" aria-label="Hauptnavigation">
          <a href="#/heute" data-route="heute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /><path d="M10 21v-6h4v6" /></svg>Heute</a>
          <a href="#/fokus" data-route="fokus"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5" /><path d="M12 10v3.5l2.5 2" /><path d="M9.5 2.5h5" /></svg>Fokus</a>
          <a href="#/bibliothek" data-route="bibliothek"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h14v15H6a2 2 0 0 0-2 2z" /><path d="M4 20a2 2 0 0 0 2 1h14v-3" /><path d="M9 7.5h7" /></svg>Bibliothek</a>
          <a href="#/statistik" data-route="statistik"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5h18" /><path d="M6 20.5V11" /><path d="M12 20.5V4" /><path d="M18 20.5v-6" /></svg>Statistik</a>
          <a href="#/erfolge" data-route="erfolge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.5h8V9a4 4 0 0 1-8 0z" /><path d="M8 5.5H5a3 3 0 0 0 3 4" /><path d="M16 5.5h3a3 3 0 0 1-3 4" /><path d="M12 13v3.5" /><path d="M8.5 20.5h7l-.8-4h-5.4z" /></svg>Erfolge</a>
          <a href="#/einstellungen" data-route="einstellungen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1" /><circle cx="15" cy="6.5" r="2" /><circle cx="9" cy="12" r="2" /><circle cx="17" cy="17.5" r="2" /></svg>Einstellungen</a>
        </nav>
        <div class="side-bottom"><a href="#/erfolge" id="side-level" class="side-level" aria-label="Level und Streak"></a></div>
      </aside>

      <header class="topbar">
        <a class="brand" href="#/heute"><img src="icons/icon.svg" alt="" width="28" height="28" /><span>Fortschritt</span></a>
        <div class="topbar-chips">
          <span id="sync-indicator" class="sync-dot" role="img" aria-label="Sync-Status" hidden></span>
          <a href="#/erfolge" class="chip-stat" id="chip-streak" aria-label="Streak">🔥 0</a>
          <a href="#/erfolge" class="chip-stat" id="chip-level" aria-label="Level">Lv 1</a>
          <a href="#/einstellungen" class="icon-btn" data-route="einstellungen" aria-label="Einstellungen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1" /><circle cx="15" cy="6.5" r="2" /><circle cx="9" cy="12" r="2" /><circle cx="17" cy="17.5" r="2" /></svg>
          </a>
        </div>
      </header>

      <main id="view" tabindex="-1">
        <noscript><p style="padding: 24px">Diese App braucht JavaScript.</p></noscript>
      </main>
    </div>

    <div id="mini-timer" class="mini-timer" hidden>
      <button class="mini-main" data-action="mini-open"><span id="mini-kind" aria-hidden="true">🎯</span><span id="mini-time">00:00</span><span class="mini-label">Session läuft</span></button>
      <button id="mini-toggle" class="icon-btn" data-action="timer-toggle" aria-label="Pause">⏸</button>
      <button class="icon-btn" data-action="timer-stop" aria-label="Fertig">■</button>
    </div>

    <nav class="tabbar" aria-label="Hauptnavigation">
      <a href="#/heute" data-route="heute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /><path d="M10 21v-6h4v6" /></svg><span>Heute</span></a>
      <a href="#/fokus" data-route="fokus"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5" /><path d="M12 10v3.5l2.5 2" /><path d="M9.5 2.5h5" /></svg><span>Fokus</span></a>
      <a href="#/bibliothek" data-route="bibliothek"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h14v15H6a2 2 0 0 0-2 2z" /><path d="M4 20a2 2 0 0 0 2 1h14v-3" /><path d="M9 7.5h7" /></svg><span>Bibliothek</span></a>
      <a href="#/statistik" data-route="statistik"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5h18" /><path d="M6 20.5V11" /><path d="M12 20.5V4" /><path d="M18 20.5v-6" /></svg><span>Statistik</span></a>
      <a href="#/erfolge" data-route="erfolge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.5h8V9a4 4 0 0 1-8 0z" /><path d="M8 5.5H5a3 3 0 0 0 3 4" /><path d="M16 5.5h3a3 3 0 0 1-3 4" /><path d="M12 13v3.5" /><path d="M8.5 20.5h7l-.8-4h-5.4z" /></svg><span>Erfolge</span></a>
    </nav>

    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <dialog id="confirm" aria-labelledby="confirm-title"></dialog>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="tip" class="tip" role="tooltip" hidden></div>
    <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
  </body>
</html>
